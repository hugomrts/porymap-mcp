[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "porymap-mcp"
version = "1.0.1"
description = "MCP server that lets AI agents author Porymap-compatible Pokémon Gen-3 decompilation maps."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Hugo Martins" }]
keywords = ["mcp", "porymap", "pokeemerald", "rom-hack", "model-context-protocol", "fastmcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.0",
]

[project.optional-dependencies]
render = ["Pillow>=10.0", "numpy>=1.26"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pre-commit>=3.7",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.scripts]
porymap-mcp = "porymap_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/hugomrts/porymap-mcp"
Repository = "https://github.com/hugomrts/porymap-mcp"
Issues = "https://github.com/hugomrts/porymap-mcp/issues"
Changelog = "https://github.com/hugomrts/porymap-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/porymap_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/porymap_mcp",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Markdown code fences (ADRs, agent prompts) hold illustrative pseudo-code
# with hand-aligned comments; keep ruff off them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "RUF",      # ruff-specific
    "SIM",      # simplify
    "TID",      # tidy imports
    "PT",       # pytest style
    "PTH",      # use pathlib
    "RET",      # return
    "ANN",      # annotations
]
ignore = [
    "ANN401",   # Allow Any in narrow cases
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy and Pillow are optional-extra deps (ADR-0010); mypy's isolated env
# typically does not see them. Ignore missing imports so the strict check
# passes without forcing every contributor to install the render extra.
module = ["numpy", "numpy.*", "PIL", "PIL.*"]
ignore_missing_imports = true

# --- pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=porymap_mcp",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "requires_porymap: integration tests requiring a real Porymap binary (run with `-m requires_porymap`)",
    "slow: tests that take more than ~1s individually",
]

# --- coverage ---
[tool.coverage.run]
source = ["porymap_mcp"]
branch = true

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
show_missing = true
skip_covered = false
